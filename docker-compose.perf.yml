version: '3.9'

services:
  backend:
    environment:
      UVICORN_RELOAD: "0"
      UVICORN_WORKERS: "8"
      DB_POOL_SIZE: "30"
      DB_MAX_OVERFLOW: "60"
    expose:
      - "8000"
    ports: [] # override dev port mapping to allow scaling
    deploy:
      replicas: 1

  backend-lb:
    image: nginx:alpine
    container_name: registro-participantes-backend-lb
    depends_on:
      - backend
    volumes:
      - ./deploy/perf/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - app-network

networks:
  app-network:
    external: false
